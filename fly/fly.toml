# Fly.io config for the central Frame Art Manager. See docs/MULTI_HOME_PLAN.md.
# Deploy from REPO ROOT (build context must include frame_art_manager/app/):
#   fly deploy --remote-only -c fly/fly.toml --dockerfile fly/Dockerfile
#
# Required secrets (fly secrets set ...):
#   GIT_SSH_KEY_B64  base64 of the deploy key (Phase 1: READ-ONLY key; Phase 3: write key)
#   TS_AUTHKEY       tailscale auth key (first boot only; identity persists on volume)
# Phase 4 adds: HOUSES_JSON (env below or secret) + HA_TOKEN_MADRONE / HA_TOKEN_LAU.
#
# DELIBERATELY NO [http_service]: access is tailnet-only (https://frame.<tailnet>.ts.net).
# Adding [http_service] would (a) expose the unauthenticated app publicly and (b) enable
# auto-stop, which tailnet traffic can never wake. The machine runs always-on.

app = "frame-art-manager"
primary_region = "lax"

[mounts]
  source = "frame_art_data"
  destination = "/data"

[env]
  NODE_ENV = "production"
  FRAME_ART_PATH = "/data/frame_art"
  PORT = "8099"
  # Second listener so http://frame.mad/ (and later frame.lau) work without a
  # port suffix — tailscale serve can't, it matches on Host header.
  HTTP_ALT_PORT = "80"
  TS_HOSTNAME = "frame"
  GIT_AUTO_PULL_ON_STARTUP = "true"
  GIT_AUTO_PUSH_ON_CHANGE = "true"
  TAILSCALE_PROXY = "socks5h://localhost:1055"
  # Lau since 2026-10-04: ha-lau by its own tailnet address on port 80 (HAOS serves HA there), so the
  # 10.32 re-IP never touches it; token in the Fly secret HA_TOKEN_LAU (a long-lived token on ha-lau).
  HOUSES_JSON = '[{"id":"madrone","name":"Madrone","ha_url":"http://100.81.0.118:8123","token_env":"HA_TOKEN_MADRONE"},{"id":"lau","name":"Launiupoko","ha_url":"http://100.87.218.7","token_env":"HA_TOKEN_LAU"}]'
  GIT_COMMIT_USER_NAME = "Frame Art Manager"
  GIT_COMMIT_USER_EMAIL = "frame-art@fly.io"
  # Phase 4: outbound proxy for HA calls to tailnet/subnet IPs (userspace tailscaled)
  # TAILSCALE_PROXY = "socks5://localhost:1055"

# 1gb -> 512mb on 2026-09-02 (Billy: ~$2.50/mo). Measured steady RSS inside the machine
# after 34 days up: node 107M + tailscaled 43M + hallpass 21M ~= 180M, so 512 keeps ~2.5x
# headroom; the swap file absorbs a git-lfs/sharp spike instead of an OOM restart.
# `fly deploy` reconciles the machine to THIS block, so size changes must land here,
# not only via `fly machine update`.
swap_size_mb = 256

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
